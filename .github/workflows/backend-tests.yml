# The whole backend suite runs in well under a minute, so there is no filtered
# subset and no `|| true`: a red test is a red build.
name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'portfolio-saas/backend/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # config.settings_test builds its own test database through these; it
      # deliberately ignores DATABASE_URL so a stray secret cannot point the
      # suite at a real database.
      TEST_PG_HOST: localhost
      TEST_PG_USER: postgres
      TEST_PG_PASSWORD: postgres
    defaults:
      run:
        working-directory: portfolio-saas/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
