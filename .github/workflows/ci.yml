name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: portfolio-saas/backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
      DJANGO_DEBUG: "0"
      ENVIRONMENT: ci
      ALLOWED_HOSTS: ci.example.test
      CORS_ORIGINS: https://ci.example.test
      REDIS_URL: redis://localhost:6379/1
      TEST_PG_USER: portfolio
      TEST_PG_PASSWORD: portfolio-ci
      TEST_PG_HOST: 127.0.0.1
      TEST_PG_PORT: "5432"
      TEST_DB_NAME: portfolio_test
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral signing secret
        run: echo "DJANGO_SECRET_KEY=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            portfolio-saas/backend/requirements.txt
            portfolio-saas/backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Check deployment settings
        env:
          # Validate the real production posture, not the test overrides.
          DJANGO_SETTINGS_MODULE: config.settings
        run: python manage.py check --deploy --fail-level WARNING
      - name: Run PostgreSQL test suite
        run: pytest
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run isolated restore drill
        run: ../scripts/ci_restore_drill.sh
      - name: Upload restore evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-evidence
          path: |
            portfolio-saas/backend/restore-evidence.json
            portfolio-saas/backend/source-evidence.json
            portfolio-saas/backend/target-evidence.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-saas/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portfolio-saas/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start closed-beta backend
        env:
          DJANGO_SECRET_KEY: ci-e2e-signing-key-that-is-deliberately-longer-than-fifty-characters
          EMAIL_BACKEND: django.core.mail.backends.filebased.EmailBackend
          EMAIL_FILE_PATH: /app/test-emails
        run: docker compose -f ../docker-compose.yml up -d --build db redis migrate backend
      - name: Run deterministic browser smoke
        run: npx playwright test e2e/auth.spec.js --grep "direct navigation"
      - name: Run closed-beta trust flow
        run: npx playwright test e2e/trust-flow.spec.js
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            portfolio-saas/frontend/test-results
            portfolio-saas/frontend/playwright-report
      - name: Stop closed-beta backend
        if: always()
        run: docker compose -f ../docker-compose.yml down -v
