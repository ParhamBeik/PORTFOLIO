# Every PR and every push to main. deploy.yml runs only after this workflow is
# green on a push to main, so nothing reaches the VPS that has not passed here.
#
# The backend suite runs in well under two minutes, so there is no filtered
# subset and no `|| true`: a red test is a red build, and a red build does not
# deploy.
#
# deploy.yml waits for this whole workflow to conclude success; it has no
# per-job `needs`. So every job here gates production. Checks that must not
# gate a deploy live in their own workflows: audit.yml (dependency CVEs) and
# mobile.yml (Android build).
#
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One deploy at a time. Two overlapping runs would race on `git reset --hard`
# and on the compose rebuild; the newer commit is the one worth shipping.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # The image production runs (docker-compose.prod.yml), not plain
      # postgres:16. Without the extension migrations 0002/0020 skip the tick
      # hypertable and its compression, and every Timescale-aware reader takes
      # its fallback, so CI tested a database shape production does not have.
      # tests/test_timescale_storage.py pins that shape. Keep the tag in step
      # with docker-compose.prod.yml.
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # config.settings_test builds its own test database through these; it
      # deliberately ignores DATABASE_URL so a stray secret cannot point the
      # suite at a real database.
      TEST_PG_HOST: localhost
      TEST_PG_USER: postgres
      TEST_PG_PASSWORD: postgres
      # Fail, not skip, the Timescale storage tests if the service above ever
      # loses the extension.
      REQUIRE_TIMESCALEDB: '1'
    defaults:
      run:
        working-directory: portfolio-saas/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Correctness only -- undefined names, unused/shadowed imports, misplaced
      # control flow. Added because two `logger` references in MyOptimal's
      # `except` handlers pointed at a name the module never defined: the
      # handlers existed to degrade gracefully and instead raised NameError and
      # 500'd. A test only finds that if it exercises the unhappy path; this
      # finds it on every commit. Rules and their reasoning: backend/ruff.toml.
      - name: Lint Python
        run: ruff check .
      # Same skill/reviewer is hand-copied for Claude (.claude/) and Codex
      # (.codex/, .agents/); the copies had already drifted once.
      - name: Agent config in sync
        working-directory: ${{ github.workspace }}
        run: python .github/scripts/check_agent_config_sync.py
      # A model edited without its migration deploys cleanly and then fails at
      # runtime on the first query. Catch the drift here instead.
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings_test
      - run: python -m pytest -q
      # Lint the deployment scripts and frontend Lighthouse runner.
      # frontend/scripts/*.sh is in the glob too. `lhci.sh` is bash, it is what
      # `npm run test:lighthouse` runs, and the `frontend` job that runs it
      # gates `deploy` -- so it sits on the deploy path exactly like the scripts
      # beside it, and was the only shell on that path nothing linted.
      - name: Lint shell scripts
        working-directory: portfolio-saas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning scripts/*.sh frontend/scripts/*.sh
      - name: Test deployment guard
        working-directory: portfolio-saas
        run: |
          bash scripts/test_deploy.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-saas/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portfolio-saas/frontend/package-lock.json
      - run: npm ci
      # The check Vite does not do. Rollup resolves module specifiers, not
      # identifiers, so a component referencing a name nothing imported builds
      # clean and throws ReferenceError in the browser when that branch renders
      # -- a blank page from a green build. `no-undef` is why this step exists;
      # `rules-of-hooks` and unused-variable detection come along for free.
      # Rules and their reasoning: frontend/eslint.config.js.
      - run: npm run lint
      # Includes the colour-contrast guard (src/contrast.test.mjs), which reads
      # the tokens straight out of index.css. Deterministic and ~60ms, so the
      # regression that used to need a browser now fails on the commit itself.
      - run: npm run test:unit
      - run: npm run test:vitest
      - run: npm run build

      # Lighthouse against the REAL production image, not the dist folder.
      #
      # Half of what a 100 depends on is response headers -- CSP, HSTS, nosniff,
      # COOP and gzip -- and a static file server has none of them, so auditing
      # `dist/` would score a bundle nobody is served. `lhci.sh` builds
      # Dockerfile.prod, runs it behind an API stub, asserts the headers, then
      # runs Lighthouse. `deploy` already depends on this job, so a regression
      # blocks the deploy with no extra wiring.
      - name: Lighthouse + response-header assertions
        run: npm run test:lighthouse

  # Layout guard: no page wider than the screen (five widths, light and
  # dark), chart tooltips on screen, no English left in the Persian UI. Runs
  # against a fixture API, so it needs no backend and no credentials; its own
  # job so the browser download runs beside the frontend job, not after it.
  # What each check pins, and the bug that shipped before it: the header
  # comment of e2e/layout-sweep.spec.js.
  layout:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-saas/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portfolio-saas/frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:layout
