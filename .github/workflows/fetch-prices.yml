# External dead-man probe. The endpoint returns 503 when prices are stale.
# Configure the repository variable DOMAIN, for example app.example.com.
name: Price feed probe (dead-man)

on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe /api/health/prices/
        run: curl -fsS -m 30 "https://${{ vars.DOMAIN }}/api/health/prices/"
