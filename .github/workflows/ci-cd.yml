# Push to main -> test -> deploy. Nothing reaches the VPS that has not gone
# green here first, and the VPS runs origin/main and nothing else.
#
# The backend suite runs in well under two minutes, so there is no filtered
# subset and no `|| true`: a red test is a red build, and a red build does not
# deploy.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   VPS_HOST         the server's address
#   VPS_USER         the deploy account (not root once a deploy user exists)
#   VPS_SSH_KEY      the deploy key's PRIVATE half, in full PEM form
#   VPS_KNOWN_HOSTS  output of `ssh-keyscan <host>`, so the job never trusts
#                    an unverified host key
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Advisories are published on the vendor's schedule, not ours, so a
  # dependency audit that only runs on push is blind for however long nobody
  # pushes. That is how 46 CVEs across four dependencies accumulated unnoticed
  # until someone looked by hand. `deploy` is gated on `github.event_name ==
  # 'push'`, so the weekly run tests and audits without touching production.
  schedule:
    - cron: '0 6 * * 1'

# One deploy at a time. Two overlapping runs would race on `git reset --hard`
# and on the compose rebuild; the newer commit is the one worth shipping.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # config.settings_test builds its own test database through these; it
      # deliberately ignores DATABASE_URL so a stray secret cannot point the
      # suite at a real database.
      TEST_PG_HOST: localhost
      TEST_PG_USER: postgres
      TEST_PG_PASSWORD: postgres
    defaults:
      run:
        working-directory: portfolio-saas/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Correctness only -- undefined names, unused/shadowed imports, misplaced
      # control flow. Added because two `logger` references in MyOptimal's
      # `except` handlers pointed at a name the module never defined: the
      # handlers existed to degrade gracefully and instead raised NameError and
      # 500'd. A test only finds that if it exercises the unhappy path; this
      # finds it on every commit. Rules and their reasoning: backend/ruff.toml.
      - name: Lint Python
        run: ruff check .
      # A model edited without its migration deploys cleanly and then fails at
      # runtime on the first query. Catch the drift here instead.
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings_test
      - run: python -m pytest -q
      # The shell scripts are the deploy and backup path, and nothing had ever
      # linted them. A first run found an unreachable off-host upload: the count
      # regex used doubled backslashes, so it matched nothing and `set -e` would
      # have killed the backup on the first upload -- latent only because the
      # feature has never been switched on. Errors AND warnings both fail here;
      # the tree is clean at that level, and the two genuinely-benign findings
      # carry an inline `shellcheck disable` with the reason.
      #
      # frontend/scripts/*.sh is in the glob too. `lhci.sh` is bash, it is what
      # `npm run test:lighthouse` runs, and the `frontend` job that runs it
      # gates `deploy` -- so it sits on the deploy path exactly like the scripts
      # beside it, and was the only shell on that path nothing linted.
      - name: Lint shell scripts
        working-directory: portfolio-saas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning scripts/*.sh frontend/scripts/*.sh
      - name: Test deployment and backup guards
        working-directory: portfolio-saas
        run: |
          bash scripts/test_ops_backup_evidence.sh
          bash scripts/test_broker_copy_deploy.sh
      - name: Database restore drill
        run: ../scripts/ci_restore_drill.sh
        env:
          TEST_PG_HOST: localhost
          TEST_PG_USER: postgres
          TEST_PG_PASSWORD: postgres

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-saas/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portfolio-saas/frontend/package-lock.json
      - run: npm ci
      # The check Vite does not do. Rollup resolves module specifiers, not
      # identifiers, so a component referencing a name nothing imported builds
      # clean and throws ReferenceError in the browser when that branch renders
      # -- a blank page from a green build. `no-undef` is why this step exists;
      # `rules-of-hooks` and unused-variable detection come along for free.
      # Rules and their reasoning: frontend/eslint.config.js.
      - run: npm run lint
      # Includes the colour-contrast guard (src/contrast.test.mjs), which reads
      # the tokens straight out of index.css. Deterministic and ~60ms, so the
      # regression that used to need a browser now fails on the commit itself.
      - run: npm run test:unit
      - run: npm run test:vitest
      - run: npm run build

      # Lighthouse against the REAL production image, not the dist folder.
      #
      # Half of what a 100 depends on is response headers -- CSP, HSTS, nosniff,
      # COOP and gzip -- and a static file server has none of them, so auditing
      # `dist/` would score a bundle nobody is served. `lhci.sh` builds
      # Dockerfile.prod, runs it behind an API stub, asserts the headers, then
      # runs Lighthouse. `deploy` already depends on this job, so a regression
      # blocks the deploy with no extra wiring.
      - name: Lighthouse + response-header assertions
        run: npm run test:lighthouse

  # Deliberately NOT in `deploy`'s `needs`. Everything else here tests code we
  # wrote, so red means "do not ship this". This job tests the world outside the
  # repo: a CVE published overnight in a transitive dependency has nothing to do
  # with the commit being pushed, and gating deploys on it would lock us out of
  # shipping the very upgrade that fixes it. The run still goes red, which is
  # the part that matters.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Audit Python dependencies
        working-directory: portfolio-saas/backend
        run: |
          # These two pins mirror backend/Dockerfile's builder stage. Without
          # them this audits the runner's ambient build environment rather than
          # the image we ship, and reported setuptools 79.0.1 as vulnerable
          # while production was already on 84.0.0. An audit that does not
          # describe the deployed artifact is worse than none -- it spends the
          # credibility of a red build on a machine nobody runs.
          pip install --quiet --upgrade "pip>=26.1.2" "setuptools>=83.0.0"
          pip install --quiet pip-audit
          # Audits the resolved install, not just the pinned direct
          # dependencies -- lxml and pypdf are the two fed untrusted bytes, and
          # both arrived as transitive concerns first.
          pip install --quiet -r requirements.txt
          pip-audit --progress-spinner off
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portfolio-saas/frontend/package-lock.json
      - name: Audit JS dependencies
        working-directory: portfolio-saas/frontend
        # Production dependencies, at `moderate`. This was briefly `high` to
        # accommodate the echarts XSS advisory; that upgrade has landed and the
        # tree reports 0 vulnerabilities, so the threshold went back down rather
        # than staying loose after the reason for it expired.
        run: npm audit --omit=dev --audit-level=moderate

  # Reports whether deployment is configured yet. Without this the deploy job
  # would go red on every push until the secrets exist, training everyone to
  # ignore a red build -- the one signal that has to stay meaningful.
  deploy-configured:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -n "$VPS_HOST" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VPS secrets are not set; skipping deploy."
          fi

  deploy:
    needs: [backend, frontend, deploy-configured]
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.deploy-configured.outputs.ready == 'true'
    runs-on: [self-hosted, vps-deploy]
    # A GitHub Environment gives this job its own secrets and an optional
    # manual approval gate; add reviewers there if a deploy should ever pause.
    environment: production
    steps:
      - name: Deploy origin/main to the VPS
        run: |
          set -Eeuo pipefail
          repo=/opt/apps/portfolio-repo
          cd "$repo"
          git fetch --prune origin main
          # --hard, not merge: the server mirrors origin/main exactly and has no
          # local commits worth keeping. Untracked files are left alone, which
          # is what keeps .env.production (gitignored) in place across deploys.
          git reset --hard origin/main
          cd "$repo/portfolio-saas"
          # deploy.sh takes a backup first, and backup_postgres.sh refuses to run
          # without this. The passphrase lives outside /root so the unprivileged
          # deploy user can read it.
          export BACKUP_PASSPHRASE_FILE=/etc/portfolio/backup.pass
          # deploy.sh takes it from here: backup, build, migrate, restart, then
          # verify both Celery workers and three health endpoints. It exits
          # non-zero on any failed check, which fails this job.
          #
          # Missing or unreachable mail is reported as degraded. The superuser
          # recovery link keeps accounts recoverable until a relay is configured.
          ./scripts/deploy.sh

      # `if: success()`, never `always()`. With `always()` this step ran after a
      # failed deploy and printed "Deployed <sha> to production." directly under
      # the step that had just exited 1 -- so the summary line a human actually
      # reads asserted the opposite of what happened, on three consecutive runs
      # where nothing reached the server at all.
      - name: Report the deployed revision
        if: success()
        run: echo "Deployed ${{ github.sha }} to production."

      - name: Report that nothing was deployed
        if: failure()
        run: |
          echo "::error::Deploy FAILED; production is still running the previous revision, not ${{ github.sha }}."
          exit 1
