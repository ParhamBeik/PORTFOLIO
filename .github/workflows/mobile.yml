# Capacitor sync + Android debug APK. Keeps the native projects from bit-rotting
# when plugins or webDir change; a red build still fails the PR so the branch
# cannot silently diverge.
#
# Its own workflow, not a job in ci.yml, because deploy.yml ships only when the
# whole "CI" workflow concludes success -- it has no per-job `needs`. As a CI
# job this build gated every deploy of the website, which it was never meant
# to: production stays the website until mobile auth and store signing are live.
name: Mobile

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-saas/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portfolio-saas/frontend/package-lock.json
      - run: npm ci
      - run: npm run build:mobile
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Assemble Android debug APK
        working-directory: portfolio-saas/frontend/android
        run: |
          set -euo pipefail
          if ! sdkmanager "platforms;android-36" "build-tools;35.0.0" >/tmp/sdkmanager.log 2>&1; then
            cat /tmp/sdkmanager.log
            exit 1
          fi
          ./gradlew :app:assembleDebug --no-daemon
      - name: Confirm package id
        working-directory: portfolio-saas/frontend/android
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk \
            | grep -F "name='ir.parhambm.holdings'"
