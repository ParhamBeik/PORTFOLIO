services:
  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      BAMA_DOMAIN: ${BAMA_DOMAIN:?set BAMA_DOMAIN}
      PORTFOLIO_DOMAIN: ${PORTFOLIO_DOMAIN:?set PORTFOLIO_DOMAIN}
      LE_EMAIL: ${LE_EMAIL:?set LE_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  caddy_data:
  caddy_config:

networks:
  edge:
    name: vps-edge
