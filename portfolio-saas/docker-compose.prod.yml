# Production stack: Postgres, Redis, Django API (ASGI/gunicorn), separate live
# archive/Codal Celery workers, Celery Beat, and the built SPA behind nginx.
# Dedicated 16 GB RAM / 250 GB disk VPS. Do not colocate other stacks on 16 GB.
# Application state stays on the private network; only frontend joins vps-edge.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Health: backend exposes /api/health/ (liveness) + /api/health/ready/ (DB +
# cache); the shared edge Caddy routes public traffic through frontend nginx.
x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
  DJANGO_DEBUG: "0"
  ENVIRONMENT: production
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?set ALLOWED_HOSTS}
  POSTGRES_DB: ${POSTGRES_DB:-portfolio}
  POSTGRES_USER: ${POSTGRES_USER:-portfolio}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  # Close Django connections at the end of each request/task.  This prevents
  # long-lived workers from accumulating idle PostgreSQL sessions.
  DB_CONN_MAX_AGE: "0"
  REDIS_URL: redis://redis:6379/1            # cache (DB 1)
  CELERY_BROKER_URL: redis://redis:6379/2    # broker/result (DB 2)
  CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
  BRS_API_KEY: ${BRS_API_KEY:-}
  BRS_URL: ${BRS_URL:-https://Api.BrsApi.ir/Market/Gold_Currency.php}
  TSETMC_API_KEY: ${TSETMC_API_KEY:-}
  TSETMC_URL: ${TSETMC_URL:-https://Api.BrsApi.ir/Tsetmc/AllSymbols.php}
  CODAL_S3_ENDPOINT_URL: ${CODAL_S3_ENDPOINT_URL:-http://minio:9000}
  CODAL_S3_BUCKET: ${CODAL_S3_BUCKET:-codal-artifacts}
  CODAL_S3_ACCESS_KEY: ${CODAL_S3_ACCESS_KEY:?set CODAL_S3_ACCESS_KEY}
  CODAL_S3_SECRET_KEY: ${CODAL_S3_SECRET_KEY:?set CODAL_S3_SECRET_KEY}
  CODAL_S3_REGION: ${CODAL_S3_REGION:-us-east-1}
  CODAL_HTTP_PROXY: ${CODAL_HTTP_PROXY:-}
  SNAPSHOT_PRUNE_ENABLED: "1"
  PRICE_PRUNE_ENABLED: "1"
  VPS_DISK_BUDGET_GB: "250"
  EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
  EMAIL_HOST: ${EMAIL_HOST:?set EMAIL_HOST}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?set DEFAULT_FROM_EMAIL}
  FRONTEND_VERIFICATION_URL: ${FRONTEND_VERIFICATION_URL:?set FRONTEND_VERIFICATION_URL}
  FRONTEND_PASSWORD_RESET_URL: ${FRONTEND_PASSWORD_RESET_URL:?set FRONTEND_PASSWORD_RESET_URL}
  SENTRY_DSN: ${SENTRY_DSN:-}
  ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
  QUEUE_BACKLOG_THRESHOLD: ${QUEUE_BACKLOG_THRESHOLD:-100}
  APPLICATION_ERROR_THRESHOLD: ${APPLICATION_ERROR_THRESHOLD:-20}
  PRICE_STALE_THRESHOLD_SECONDS: ${PRICE_STALE_THRESHOLD_SECONDS:-900}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Live worker filled 84 GB of core.* files on 2026-08-25 and wedged Postgres.
# Host sysctl also points core_pattern at /bin/true; this is the compose belt.
x-no-core: &no-core
  core: 0

services:
  db:
    # TimescaleDB, not stock Postgres: the tick table grows ~744k rows/day and
    # native columnar compression is the reason for the swap (see migration
    # 0030). Alpine/musl on purpose -- the cluster is en_US.utf8 on musl, and a
    # glibc image gives that collation different sort semantics, silently
    # corrupting every varchar btree in a warehouse whose keys are all varchar.
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Docker's default /dev/shm is 64 MB. Postgres allocates parallel-query and
    # parallel-vacuum state there, so on this 16 GB warehouse a plain
    # `VACUUM (ANALYZE) marketdata_stocktransactiontick` failed outright with
    # "could not resize shared memory segment ... No space left on device".
    # Any parallel plan over the big tables hits the same wall.
    shm_size: 1gb
    # The image ships the compiled-in defaults (shared_buffers 128 MB), which is
    # what this 16 GB database had been running on. Values below are sized for
    # the 6 GB limit set at the foot of this block, not for the host's 16 GB:
    # shared_buffers ~25% of the container, and work_mem kept modest because it
    # is per sort/hash node and multiplies by max_connections (150).
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb
      - -c
      # Capacity for the bounded API/Celery workers, with headroom for admin
      # maintenance.  The previous persisted default of 75 was exhausted.
      - max_connections=150
      - -c
      # Prevent abandoned worker sockets and runaway queries from consuming all
      # available sessions indefinitely.
      - idle_session_timeout=300000
      - -c
      - statement_timeout=900000
      - -c
      - shared_buffers=1536MB
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=512MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 6g

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning", "--maxmemory", "400mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data   # --save 60 1 writes an RDB snapshot; persist it outside the container layer
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    logging: *logging
    command: server /data
    environment:
      MINIO_ROOT_USER: ${CODAL_S3_ACCESS_KEY:?set CODAL_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${CODAL_S3_SECRET_KEY:?set CODAL_S3_SECRET_KEY}
    volumes:
      - codaldata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m

  migrate:
    build: ./backend
    restart: "no"
    logging: *logging
    entrypoint: []
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *backend-env
    volumes:
      - staticfiles:/app/staticfiles
    command: sh -c "python manage.py migrate --noinput && python manage.py seed_assets && python manage.py collectstatic --noinput"

  backend:
    build: ./backend
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: *backend-env
    expose: ["8000"]
    ulimits: *no-core
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Host: ${PORTFOLIO_DOMAIN:?set PORTFOLIO_DOMAIN}' -H 'X-Forwarded-Proto: https' http://localhost:8000/api/health/ready/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536m

  celery_worker_live:
    build: ./backend
    restart: unless-stopped
    logging: *logging
    entrypoint: []            # skip migrate/seed; the backend service owns DB setup
    depends_on:
      backend:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *backend-env
    command: celery -A config worker -l info --concurrency=2 -Q live -n live@%h
    ulimits: *no-core
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d live@$$HOSTNAME"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g

  celery_worker_archive:
    build: ./backend
    restart: unless-stopped
    logging: *logging
    entrypoint: []
    depends_on:
      backend:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment: *backend-env
    command: celery -A config worker -l info --concurrency=4 -Q archive -n archive@%h --max-memory-per-child=600000
    ulimits: *no-core
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d archive@$$HOSTNAME"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2g

  # Codal document download and parsing. Split off the archive worker, which used
  # to serve `-Q archive,codal`: document work is not quota-bound and should run
  # continuously, but sharing four slots with quota fetches meant it competed with
  # the backfill for exactly the resource it does not consume.
  #
  # DISABLED 2026-08-25. codal.ir is unreachable from this VPS (TCP 443 times out)
  # and CODAL_HTTP_PROXY is unset, so this worker spent every cycle retrying a
  # connect that cannot succeed -- ~20,000 no-op runs and 583 timeouts in one day
  # at ~10% of a core. Set CODAL_ENABLED=1 and uncomment this block together; the
  # flag alone controls the queue route and the beat entry, but only this block
  # creates the worker that would consume the queue.
  # celery_worker_codal:
  #   build: ./backend
  #   restart: unless-stopped
  #   logging: *logging
  #   entrypoint: []
  #   depends_on:
  #     backend:
  #       condition: service_healthy
  #     db:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     minio:
  #       condition: service_healthy
  #   environment: *backend-env
  #   command: celery -A config worker -l info --concurrency=4 -Q codal -n codal@%h --max-memory-per-child=600000
  #   healthcheck:
  #     test: ["CMD-SHELL", "celery -A config inspect ping -d codal@$$HOSTNAME"]
  #     interval: 60s
  #     timeout: 15s
  #     retries: 3
  #     start_period: 40s
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: "1"
  #         memory: 2g

  celery_beat:
    build: ./backend
    restart: unless-stopped
    logging: *logging
    entrypoint: []
    depends_on:
      celery_worker_live:
        condition: service_healthy
      celery_worker_archive:
        condition: service_healthy
    environment: *backend-env
    command: celery -A config beat -l info
    ulimits: *no-core
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    restart: unless-stopped
    logging: *logging
    depends_on:
      backend:
        condition: service_healthy
    expose: ["80"]
    volumes:
      - staticfiles:/static:ro
    networks:
      default:
      edge:
        aliases: [portfolio-frontend]

volumes:
  pgdata:
  redisdata:
  codaldata:
  staticfiles:

networks:
  edge:
    external: true
    name: vps-edge
