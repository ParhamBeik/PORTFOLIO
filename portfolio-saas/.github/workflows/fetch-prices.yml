# Dead-man's switch for the price feed — external probe.
#
# The primary staleness alarm runs ON the VPS (cron hitting
# /api/health/prices/ and restarting Celery on 503 — see DEPLOY.md §4).
# This job is the outside view: it catches the whole VPS being down or
# unreachable. The endpoint returns 503 when the freshest Price row is
# older than 15 minutes, so a red X here = feed stale or site dark.
#
# Configure the repo variable DOMAIN (Settings → Variables), e.g. app.example.com.
# No secrets, no DB access — GitHub runners can't reach an Iran-hosted
# Postgres, and the probe doesn't need to.
name: Price feed probe (dead-man)

on:
  schedule:
    - cron: "13 * * * *" # hourly, off the :00 rush
  workflow_dispatch: {} # manual run from the Actions tab

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe /api/health/prices/
        run: |
          curl -fsS -m 30 "https://${{ vars.DOMAIN }}/api/health/prices/"
