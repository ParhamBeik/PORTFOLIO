# Brings up Postgres, Redis, the Django API (ASGI), Celery worker+beat, and the
# React dev server together.
#   docker compose up --build   ->  http://localhost:5173 (API on :8000)
# Real-time: celery_beat ticks fetch_and_publish every 2 min and publishes to the
# `prices:update` Redis channel; the API streams it to clients over SSE.
x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-change-me-must-be-at-least-32-bytes-long-for-jwt-hs256}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
  ENVIRONMENT: ${ENVIRONMENT:-dev}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-backend,localhost,127.0.0.1}
  POSTGRES_DB: ${POSTGRES_DB:-portfolio}
  POSTGRES_USER: ${POSTGRES_USER:-portfolio}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/1            # cache (DB 1)
  CELERY_BROKER_URL: redis://redis:6379/2    # broker/result (DB 2, kept off the cache)
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
  BRS_API_KEY: ${BRS_API_KEY:-}
  BRS_URL: ${BRS_URL:-https://BrsApi.ir/Api/Market/Gold_Currency.php}
  TSETMC_API_KEY: ${TSETMC_API_KEY:-}
  TSETMC_URL: ${TSETMC_URL:-https://BrsApi.ir/Api/Tsetmc/AllSymbols.php}
  REAL_PORTFOLIO_DATA_DIR: /portfolio-data

services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      <<: *backend-env
      SERVICE_NAME: backend
    command: gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 1 --reload
    volumes:
      - ./backend:/app
      - "${IMPORT_DATA_DIR:-./import-data}:/portfolio-data:ro"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g

  celery_worker:
    build: ./backend
    restart: unless-stopped
    entrypoint: []        # skip migrate/seed; the backend service owns DB setup
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      <<: *backend-env
      SERVICE_NAME: celery_worker
    volumes:
      - ./backend:/app
    command: celery -A config worker -l info --concurrency=2
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g


  celery_beat:
    build: ./backend
    restart: unless-stopped
    entrypoint: []
    depends_on:
      # ponytail: celery_worker has no healthcheck in this compose file, so this
      # stays service_started (weak). Add a worker healthcheck first if beat
      # firing before the worker can consume becomes an actual problem.
      celery_worker:
        condition: service_started
    environment:
      <<: *backend-env
      SERVICE_NAME: celery_beat
    volumes:
      - ./backend:/app
    command: celery -A config beat -l info
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m


  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_URL: ${VITE_API_URL:-}
      # Server-side Vite proxy target — the browser uses relative /api (above is
      # empty), Vite forwards it to the backend service inside the compose network.
      VITE_PROXY_TARGET: ${VITE_PROXY_TARGET:-http://backend:8000}
      # Docker-on-Mac/Windows doesn't propagate host FS events into the VM, so
      # Vite's watcher must poll to see your edits and trigger HMR.
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app        # host source -> container, so saves reach Vite (HMR)
      - /app/node_modules      # keep the image's installed deps, don't shadow them
    ports:
      - "5173:5173"
    command: sh -c "npm ci && npm run dev"

volumes:
  pgdata:
