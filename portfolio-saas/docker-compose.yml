# Brings up Postgres, Redis, the Django API (ASGI), Celery worker+beat, and the
# React dev server together.
#   docker compose up --build   ->  http://localhost:5173 (API on :8000)
# Real-time: celery_beat ticks fetch_and_publish every 2 min and publishes to the
# `prices:update` Redis channel; the API streams it to clients over SSE.
x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-change-me-must-be-at-least-32-bytes-long-for-jwt-hs256}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
  DB_CONN_MAX_AGE: "0"
  ENVIRONMENT: ${ENVIRONMENT:-dev}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-backend,localhost,127.0.0.1}
  POSTGRES_DB: ${POSTGRES_DB:-portfolio}
  POSTGRES_USER: ${POSTGRES_USER:-portfolio}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/1            # cache (DB 1)
  CELERY_BROKER_URL: redis://redis:6379/2    # broker/result (DB 2, kept off the cache)
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
  EMAIL_FILE_PATH: ${EMAIL_FILE_PATH:-/app/test-emails}
  FRONTEND_VERIFICATION_URL: ${FRONTEND_VERIFICATION_URL:-http://localhost:5173/verify-email}
  FRONTEND_PASSWORD_RESET_URL: ${FRONTEND_PASSWORD_RESET_URL:-http://localhost:5173/reset-password}
  BRS_API_KEY: ${BRS_API_KEY:-}
  BRS_URL: ${BRS_URL:-https://Api.BrsApi.ir/Market/Gold_Currency.php}
  TSETMC_API_KEY: ${TSETMC_API_KEY:-}
  TSETMC_URL: ${TSETMC_URL:-https://Api.BrsApi.ir/Tsetmc/AllSymbols.php}
  MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017}
  MONGO_DATABASE: ${MONGO_DATABASE:-portfolio}
  CODAL_S3_ENDPOINT_URL: ${CODAL_S3_ENDPOINT_URL:-http://minio:9000}
  CODAL_S3_BUCKET: ${CODAL_S3_BUCKET:-codal-artifacts}
  CODAL_S3_ACCESS_KEY: ${CODAL_S3_ACCESS_KEY:-codal}
  CODAL_S3_SECRET_KEY: ${CODAL_S3_SECRET_KEY:-codal-secret-change-me}
  CODAL_S3_REGION: ${CODAL_S3_REGION:-us-east-1}
  CODAL_HTTP_PROXY: ${CODAL_HTTP_PROXY:-}

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    # TimescaleDB, not stock Postgres: the tick table grows ~744k rows/day and
    # native columnar compression is the reason for the swap (see migration
    # 0030). Alpine/musl on purpose -- the cluster is en_US.utf8 on musl, and a
    # glibc image gives that collation different sort semantics, silently
    # corrupting every varchar btree in a warehouse whose keys are all varchar.
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    logging: *json-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    # Docker's default 64 MB /dev/shm is too small for Postgres' parallel-query
    # and parallel-vacuum state once the warehouse is large; VACUUM (ANALYZE) on
    # the tick table fails without this. Smaller than prod because a dev laptop
    # gives the whole Docker VM only a few GB.
    shm_size: 256mb
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    logging: *json-logging
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  mongo:
    image: mongo:7
    restart: unless-stopped
    logging: *json-logging
    command: ["mongod", "--wiredTigerCacheSizeGB", "1"]
    volumes:
      - mongodata:/data/db
    healthcheck:
      # `mongosh` pings open several server-side connections and dominate Compose
      # logs. PID 1 is the mongod process; Docker restart policy handles a dead one.
      test: ["CMD-SHELL", "test \"$$(cat /proc/1/comm)\" = mongod"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1280m

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    logging: *json-logging
    command: server /data
    environment:
      MINIO_ROOT_USER: ${CODAL_S3_ACCESS_KEY:-codal}
      MINIO_ROOT_PASSWORD: ${CODAL_S3_SECRET_KEY:-codal-secret-change-me}
    volumes:
      - codaldata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build: ./backend
    restart: "no"
    logging: *json-logging
    entrypoint: []
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment: *backend-env
    volumes:
      - ./backend:/app
    command: sh -c "python manage.py migrate --noinput && python manage.py seed_assets && python manage.py collectstatic --noinput"

  backend:
    build: ./backend
    restart: unless-stopped
    logging: *json-logging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *backend-env
      SERVICE_NAME: backend
    # --workers 2: a single worker means one slow synchronous view (optimizer,
    # cold-cache admin overview) blocks every other request on the same
    # process, including the healthcheck and login. --timeout 90: Gunicorn's
    # 30s default SIGABRTs the worker mid-computation on a legitimately slow
    # analytics request, which previously took the healthcheck and every
    # other in-flight request down with it.
    command: gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 2 --timeout 90 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g

  celery_worker:
    build: ./backend
    restart: unless-stopped
    logging: *json-logging
    entrypoint: []        # skip migrate/seed; the backend service owns DB setup
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      <<: *backend-env
      SERVICE_NAME: celery_worker
    volumes:
      - ./backend:/app
    command: celery -A config worker -l info --concurrency=2 -Q live -n live@%h
    # The image's Dockerfile HEALTHCHECK curls the Django health endpoint, which a
    # worker does not serve, so it was permanently unhealthy. inspect ping asks
    # this worker over the broker and is the real liveness signal.
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d live@$$HOSTNAME"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g

  # Archive queue: archive_tick claims states and fans out run_archive_state tasks.
  # Concurrency 4 processes several independently leased states in parallel;
  # quota still serializes provider spend. Kept off the live queue so price
  # fetches never wait on a backfill batch.
  celery_worker_archive:
    build: ./backend
    restart: unless-stopped
    logging: *json-logging
    entrypoint: []        # skip migrate/seed; the backend service owns DB setup
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      <<: *backend-env
      SERVICE_NAME: celery_worker_archive
    volumes:
      - ./backend:/app
    command: celery -A config worker -l info --concurrency=2 -Q archive -n archive@%h --max-memory-per-child=400000
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d archive@$$HOSTNAME"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1536m

  celery_worker_codal:
    build: ./backend
    restart: unless-stopped
    logging: *json-logging
    entrypoint: []
    depends_on:
      backend:
        condition: service_started
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: *backend-env
      SERVICE_NAME: celery_worker_codal
    volumes:
      - ./backend:/app
    command: celery -A config worker -l info --concurrency=1 -Q codal -n codal@%h --max-memory-per-child=600000
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d codal@$$HOSTNAME"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 40s

  celery_beat:
    build: ./backend
    restart: unless-stopped
    logging: *json-logging
    entrypoint: []
    depends_on:
      celery_worker:
        condition: service_healthy
      celery_worker_archive:
        condition: service_healthy
    environment:
      <<: *backend-env
      SERVICE_NAME: celery_beat
    volumes:
      - ./backend:/app
    command: celery -A config beat -l info
    # Beat has no inspect endpoint and serves no HTTP, so the inherited curl
    # healthcheck can only ever fail. There is nothing meaningful to probe.
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m


  frontend:
    build: ./frontend
    restart: unless-stopped
    logging: *json-logging
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_URL: ${VITE_API_URL:-}
      # Server-side Vite proxy target — the browser uses relative /api (above is
      # empty), Vite forwards it to the backend service inside the compose network.
      VITE_PROXY_TARGET: ${VITE_PROXY_TARGET:-http://backend:8000}
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
      # Docker-on-Mac/Windows doesn't propagate host FS events into the VM, so
      # Vite's watcher must poll to see your edits and trigger HMR.
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app        # host source -> container, so saves reach Vite (HMR)
      - /app/node_modules      # keep the image's installed deps, don't shadow them
    ports:
      - "5173:5173"
    command: sh -c "npm ci && npm run dev"

volumes:
  pgdata:
  mongodata:
  codaldata:
