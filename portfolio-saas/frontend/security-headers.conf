# Security headers for every response this server sends.
#
# Kept in a snippet and `include`d rather than written once at server level,
# because nginx's add_header does NOT merge: a `location` block that declares
# any add_header of its own silently discards every header inherited from the
# server block. `location /assets/` sets Cache-Control, so without re-including
# here it would serve JavaScript with no CSP at all -- the exact failure mode
# that makes this a snippet instead of five lines above.

# Content-Security-Policy.
#
# `script-src 'self'` with no 'unsafe-inline' and no 'unsafe-eval' is what
# Lighthouse's csp-xss audit actually checks for, and this app can afford it:
# Vite emits external module scripts, there are no inline <script> blocks, and
# no third-party script tags.
#
# `style-src` DOES need 'unsafe-inline'. React renders `style={{...}}` props as
# style attributes (ui.jsx Table column widths, MyOptimal legend swatches) and
# CSP blocks those without it. This is not the part the audit penalises.
#
# `connect-src` covers the same-origin API plus Sentry when VITE_SENTRY_DSN is
# set; drop the sentry.io entry if that integration is ever removed.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.ingest.sentry.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# One year, matching SECURE_HSTS_SECONDS in config/settings.py so the document
# and the API agree. Named, not line-numbered: that file has grown ~230 lines
# since this comment was written and the number pointed at unrelated settings.
# Only meaningful over HTTPS, which the vps-edge proxy terminates.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;

# Origin isolation. `frame-ancestors 'none'` above already covers clickjacking
# for modern browsers; COOP is the one Lighthouse checks by name.
add_header Cross-Origin-Opener-Policy "same-origin" always;

# This app embeds nothing cross-origin, so the restrictive default is free.
add_header X-Frame-Options "DENY" always;
