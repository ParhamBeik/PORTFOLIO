# Compression. The stock nginx image ships gzip commented out, so every asset
# went over the wire raw: the echarts chunk alone is 596 kB, and it is already
# tree-shaken (see components/charts.jsx -- the barrel import was 1,049 kB), so
# there is no smaller bundle to reach for. Compression is the whole remaining
# win, worth roughly 70% of transfer on this bundle.
#
# `gzip_static` is deliberate: the build can emit .gz next to each asset and
# nginx then serves it without recompressing on every request. It falls back to
# on-the-fly gzip when no precompressed twin exists, so it is safe with or
# without that build step.
gzip on;
gzip_vary on;
gzip_static on;
gzip_comp_level 6;
# 1400 bytes ~ one MTU: below that compression costs a CPU cycle to save nothing.
gzip_min_length 1400;
gzip_proxied any;
gzip_types
    text/plain text/css text/javascript
    application/javascript application/json application/manifest+json
    image/svg+xml font/woff font/woff2;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers for the DOCUMENT, which Django never sees.
    #
    # config/settings.py sets SECURE_HSTS_*, SECURE_CONTENT_TYPE_NOSNIFF and
    # SECURE_REFERRER_POLICY, but those only ride on /api/ and /admin/ responses.
    # Lighthouse audits the HTML this server returns, and it arrived with no
    # security headers at all.
    #
    # `always` matters: without it nginx omits these on error responses, so a 404
    # or a 502 would be served unprotected.
    include /etc/nginx/snippets/security-headers.conf;

    # Re-resolve the backend on every request instead of once at startup.
    #
    # With a literal `proxy_pass http://backend:8000`, nginx resolves that name
    # when the worker starts and caches the address for the process lifetime.
    # Any recreation of the backend container hands it a NEW address, and this
    # container -- which the deploy does not recreate, because its own image is
    # unchanged -- keeps dialling the dead one. The site then serves `/` at 200
    # while every `/api/` call returns 502, which is exactly what the
    # 2026-08-21 deploy produced and what the post-deploy smoke test caught.
    # It is not only a deploy concern: an unattended backend restart breaks the
    # API the same way until someone restarts this container by hand.
    #
    # 127.0.0.11 is Docker's embedded DNS. Naming the upstream through a
    # variable is what forces the lookup to happen per request; `$request_uri`
    # is then required, because a proxy_pass containing a variable no longer
    # forwards the original URI on its own.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:8000;

    # Vite emits content-hashed filenames, so assets are immutable.
    #
    # The re-include is required, not redundant: declaring Cache-Control here
    # drops every add_header inherited from the server block. See the snippet.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /static/ {
        alias /static/;
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Tiered deadlines by endpoint intensity. Re-enable buffering so slow clients
    # do not tie up backend workers.
    location /api/optimization/ {
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_buffering on;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/analytics/ {
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_buffering on;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ~ ^/api/accounts/[0-9]+/imports/ {
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_buffering on;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/ {
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_buffering on;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /admin/ {
        proxy_pass http://$backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # SPA fallback: unknown paths fall through to index.html for client routing.
    #
    # `no-cache` is not "do not store" -- it stores and revalidates, so the
    # common case is a 304 off the ETag and costs one conditional request. It is
    # here because this document is the ONE file whose name does not change
    # between builds. Everything under /assets/ is content-hashed and marked
    # immutable above, and index.html is what names the current hashes. Without
    # an explicit directive a browser applies heuristic freshness (a fraction of
    # the time since Last-Modified) and may keep serving the previous shell,
    # which points at asset filenames the new deploy no longer has: the user
    # sees a blank page or the old app until they hard-reload.
    #
    # The re-include is required, not redundant -- declaring any add_header in a
    # location drops every header inherited from the server block. See the
    # snippet's own header for the full explanation.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
