server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve the backend on every request instead of once at startup.
    #
    # With a literal `proxy_pass http://backend:8000`, nginx resolves that name
    # when the worker starts and caches the address for the process lifetime.
    # Any recreation of the backend container hands it a NEW address, and this
    # container -- which the deploy does not recreate, because its own image is
    # unchanged -- keeps dialling the dead one. The site then serves `/` at 200
    # while every `/api/` call returns 502, which is exactly what the
    # 2026-08-21 deploy produced and what the post-deploy smoke test caught.
    # It is not only a deploy concern: an unattended backend restart breaks the
    # API the same way until someone restarts this container by hand.
    #
    # 127.0.0.11 is Docker's embedded DNS. Naming the upstream through a
    # variable is what forces the lookup to happen per request; `$request_uri`
    # is then required, because a proxy_pass containing a variable no longer
    # forwards the original URI on its own.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:8000;

    # Vite emits content-hashed filenames, so assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /static/ {
        alias /static/;
        expires 1h;
    }

    location /api/ {
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /admin/ {
        proxy_pass http://$backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # SPA fallback: unknown paths fall through to index.html for client routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
